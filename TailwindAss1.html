<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Ass1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="mx-auto max-w-md p-5 bg-pink-100 rounded-lg  shadow-lg flex gap-8 mt-20">
        <div class="flex flex-col gap-4">
            <h2 class="font-bold">Update Variables</h2>
            <label for="name">Name</label>

            <input type="text" id="name" value="Alex Walker" oninput="updateCard()"></input>

            <label for="age">Age(Number):</label>

            <input type="number" id="age" value="28" oninput="updateCard()"></input>

            <label for="VIP">VIP Status:</label>

            <input type="checkbox" id="VIP" oninput="updateCard()"></input>

            <label for="cardcolor">Card Color:</label>

            <input type="color" id="cardcolor" value="pink" oninput="updateCard()"></input>
        </div>
            <div class="rounded-lg ">
            <h2 class="font-bold">Live DOM Output</h2>
             <div  id="cardResult" class=" rounded-lg shadow-[0_20px_25px_-5px_rgba(236,72,153,0.45),0_10px_10px_-5px_rgba(219,39,119,0.3)] border-2 border-pink-400 bg-pink-300 mt-8 w-40 p-4">
            <p id="sampleoutput">VIP Status</p>
            <p id="outname" class="font-bold">Alex Walker</p>
            <p id="outage">28</p>
            </div>
        </div>
    </div>
    <script>
     function updateCard() {
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let VIP = document.getElementById("VIP").checked;
            let cardcolor = document.getElementById("cardcolor").value;
            let sampleoutput = document.getElementById("sampleoutput");
            let outname = document.getElementById("outname");
            let outage = document.getElementById("outage");
            let cardResult = document.getElementById("cardResult");
            outname.innerHTML = name;
            outage.innerHTML = "Age:" + age;
            cardResult.style.backgroundColor = cardcolor;
            if (VIP) {
                sampleoutput.innerHTML = "<p style='border:1px solid;border-radius:10px;background-color:yellow;width:100px;'>VIP member</p>";
            }
            else {
                sampleoutput.innerHTML = "";
            }
        }   
    </script>
</body>

</html>
