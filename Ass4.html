<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            overflow: hidden;
        }

        .container {
            width: 450px;
            height: 250px;
            border: 1px solid black;
            border-radius: 10px;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 200px;
            gap: 20px;
        }

        button {
            background-color: blue;
            color: aliceblue;
            width: 385px;
            height: 30px;
            border-radius: 5px;
        }
button:hover{
    background-color: rgb(11, 11, 70);
}
        p {
            border: 1px dotted black;
            border-radius: 5px;
            width: 385px;
            height: 30px;
            display: flex;
            justify-content: space-between;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Mini Calculator</h1>
        <span>
            <input type="number" id="num1"></input>
            <select name="" id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <input type="number" id="num2"></input>
        </span>
        <button onclick="calculate()">Calculate Amount</button>
        <p>Result:<span id="answer"></span></p>
    </div>
    <script>
        function calculate() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let operator = document.getElementById("operator").value;
            let result;
            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("answer").innerText = "Error";
            }
            else{

                switch (operator) {
                    case "+":
                        result = num1 + num2;
                        break;
                    case "-":
                        result = num1 - num2;
                        break;
                    case "*":
                        result = num1 * num2;
                        break;
                    case "/":
                        if(num2==0){
                            result="Cannot divide by 0";
                        }
                        else{
                        result = num1 / num2;
                        }
                        break;
                        Default = "Invalid"
                }
                document.getElementById("answer").innerText = result;
            }
            
        }


    </script>
</body>

</html>
