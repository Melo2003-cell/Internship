<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
            margin: auto;
            width: 800px;
        }

        th {
            background-color: rgb(80, 182, 177);
        }
        .Female{
            background-color: rgb(107, 160, 190);
        }
        .Male{
            background-color: aqua;
        }
        table tr td:last-child{
            background-color: rgb(206, 112, 170);
        }
         table tr td:first-child{
            background-color: rgb(43, 153, 135);
        }
         table tr td:nth-child(2){
            background-color: rgb(228, 96, 147);
        }
    </style>
</head>

<body>
    <table border="1">
        <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">Student Name</th>
            <th rowspan="2">Gender</th>
            <th rowspan="2">Roll No.</th>
            <th colspan="3">Marks</th>
        <tr>
            <th>Myanmar</th>
            <th>English</th>
            <th>Maths</th>
        </tr>
        </tr>
        <tr class="Female">
            <td style="text-align: center;">1</td>
            <td>Su Su</td>
            <td rowspan="2" style="text-align: center;">Female</td>
            <td>5CS-32</td>
            <td style="text-align: right;">60</td>
            <td style="text-align: right;">75</td>
            <td style="text-align: right;">86</td>
        </tr>
        <tr class="Female">
            <td style="text-align: center;">2</td>
            <td>Moe Moe</td>
            <!-- <td rowspan="2">Female</td> -->

            <td style="text-align: right;">78</td>

        <tr class="Male" >
            <td style="text-align: center;">3</td>
            <td>Kyaw Kyaw</td>

            <td>5CS-34</td>

        <tr class="Male">

    </table>
</body>

</html>
