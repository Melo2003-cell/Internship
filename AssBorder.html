<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        * {

            margin: 0;

        body {

            overflow: hidden;
        }

        nav {

            text-align: center;

            margin-top: 5px;

        }

        a {
            /* padding-left: 30px; */
            /* display: flex;

            gap: 5px; */

            color: white;
        }

          justify-content: space-around;

            /* color: white; */


        }

        .feature {

            height: 200px; */
            display: flex;
            margin: auto;
            justify-content: space-around;
            gap: 10px;
            padding: 10px;

        }

        h3 {
            width: 300px;

            justify-content: center;
            background-color: aquamarine;



        }

        .box1 {
            width: 2000px;
            background-color: beige;

            border-radius: 10px;
        }

        .container {
            display: flex;

        }

            margin: 10px;
            color: white;
        }

</head>

<body>
    <h2>CSS Utility Simulator</h2>
    <p>Change the inputs below to see how atomic classes combine to build Uls </p>
    <nav>
        <h2>MyLogo</h2>
        <div class="myLogo">
            <a href="">Home</a>

    <div class="feature">

        <h3>Feature2</h3>
        <h3>Feature3</h3>
    </div>

    <div class="container">

        <section class="box1">

            <h2>Utility Controls</h2>
            <label for="space">Padding(Spacing)</label>
            <select name="space" id="space">
                <option>Medium(p-8)</option>
            </select>

            <label for="color">Background Theme(Colors)</label>
            <select name="color" id="color">
                <option>Primary Blue</option>
            </select>

            <label for="typo">Text Size(Typography)</label>
            <select name="typo" id="typo">
                <option>Large(text-xl)</option>
            </select>

            <label for="border">Corner Radius(Borders)</label>
            <select name="border" id="border">
                <option>Square(rounded-none)</option>
            </select>

            <label for="Depth">Medium (shadow-mid)</label>
            <select name="space" id="space">
                <option>Medium(p-8)</option>
            </select>
        </section>

        <section class="box2">
            <div class="box3">
                <h2>Alex Walker</h2>
                <p>Full-Stack WEb Developer building awesome things with Tailwind CSS.</p>

            </div>

    <button>Submit</button>
